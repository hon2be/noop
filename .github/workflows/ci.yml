name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: 린트 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Python 설정
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: ruff 설치
        run: pip install ruff --quiet

      - name: 코드 스타일 검사
        run: ruff check noop/

      - name: 포맷 검사
        run: ruff format --check noop/

  import-check:
    name: 임포트 / 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Python 설정
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: pip / setuptools 최신화
        run: pip install --upgrade pip setuptools --quiet

      - name: 패키지 설치 (editable)
        run: pip install -e . --quiet

      - name: 모든 모듈 임포트 검사
        run: |
          python - <<'EOF'
          import sys
          modules = [
              "noop",
              "noop.i18n",
              "noop.pack_loader",
              "noop.ad_client",
              "noop.renderer",
              "noop.games",
          ]
          failed = []
          for m in modules:
              try:
                  __import__(m)
                  print(f"  ✅ {m}")
              except Exception as e:
                  print(f"  ❌ {m}: {e}")
                  failed.append(m)
          if failed:
              print(f"\n실패: {failed}")
              sys.exit(1)
          print("\n✅ 모든 모듈 임포트 성공")
          EOF

      - name: 콘텐츠 팩 JSON 유효성 검사
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          packs_dir = pathlib.Path("packs")
          errors = []

          for pack_json in packs_dir.rglob("pack.json"):
              try:
                  data = json.loads(pack_json.read_text(encoding="utf-8"))
                  assert "id" in data,   f"{pack_json}: 'id' 필드 없음"
                  assert "name" in data, f"{pack_json}: 'name' 필드 없음"
                  assert "type" in data, f"{pack_json}: 'type' 필드 없음"
              except Exception as e:
                  errors.append(str(e))

          for content_json in packs_dir.rglob("content.json"):
              try:
                  data = json.loads(content_json.read_text(encoding="utf-8"))
                  assert isinstance(data, list), f"{content_json}: 최상위가 배열이어야 함"
                  for i, item in enumerate(data):
                      assert "q" in item, f"{content_json}[{i}]: 'q' 필드 없음"
              except Exception as e:
                  errors.append(str(e))

          if errors:
              for e in errors:
                  print(f"❌ {e}")
              sys.exit(1)

          print(f"✅ 콘텐츠 팩 {len(list(packs_dir.rglob('pack.json')))}개 유효성 검사 통과")
          EOF

      - name: 광고 JSON 유효성 검사
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          ads_file = pathlib.Path("ads/ads.json")
          if not ads_file.exists():
              print("⚠️  ads/ads.json 없음 — 건너뜀")
              sys.exit(0)

          try:
              data = json.loads(ads_file.read_text(encoding="utf-8"))
              assert isinstance(data, list), "최상위가 배열이어야 함"
              for i, ad in enumerate(data):
                  assert "id" in ad,    f"광고[{i}]: 'id' 필드 없음"
                  assert "title" in ad, f"광고[{i}]: 'title' 필드 없음"
              print(f"✅ 광고 {len(data)}개 유효성 검사 통과")
          except Exception as e:
              print(f"❌ {e}")
              sys.exit(1)
          EOF

  build-check:
    name: 패키지 빌드 확인
    runs-on: ubuntu-latest
    needs: [lint, import-check]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Python 설정
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: pip / setuptools / build 최신화
        run: pip install --upgrade pip setuptools build --quiet

      - name: 패키지 빌드
        run: python -m build --wheel --no-isolation

      - name: 빌드 결과 확인
        run: |
          ls -lh dist/
          python -c "
          import zipfile, pathlib
          whl = list(pathlib.Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          assert any('noop/__main__.py' in n for n in names), '__main__.py 가 wheel에 없음'
          print(f'✅ wheel 빌드 성공: {whl.name}')
          "
