name: GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 페이지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: HTML 유효성 간단 검사
        run: |
          python3 - <<'EOF'
          import pathlib, sys

          index = pathlib.Path("docs/index.html")
          if not index.exists():
              print("❌ docs/index.html 파일이 없습니다")
              sys.exit(1)

          content = index.read_text(encoding="utf-8")
          checks = [
              ("<!DOCTYPE html>", "DOCTYPE 선언"),
              ("<html",           "<html> 태그"),
              ("<title>",         "<title> 태그"),
              ("</body>",         "</body> 닫힘"),
              ("</html>",         "</html> 닫힘"),
          ]
          errors = [label for needle, label in checks
                    if needle.lower() not in content.lower()]

          if errors:
              for e in errors:
                  print(f"❌ '{e}' 없음")
              sys.exit(1)

          print(f"✅ docs/index.html 유효 ({len(content.encode())/1024:.1f} KB)")
          EOF

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: 페이지 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
